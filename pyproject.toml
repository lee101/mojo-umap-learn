[project]
name = "mojo-umap-learn"
version = "0.1.0"
description = "UMAP graph construction and embedding kernels implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
dependencies = ["numpy", "scipy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "umap-learn"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-umap-learn"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
